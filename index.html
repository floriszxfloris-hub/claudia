<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claudia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0a0a0b;
      --bg-secondary: #111113;
      --bg-tertiary: #18181b;
      --bg-elevated: #1f1f23;
      --bg-hover: #27272a;
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-tertiary: #71717a;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --accent-light: rgba(249, 115, 22, 0.1);
      --accent-glow: rgba(249, 115, 22, 0.4);
      --border: #27272a;
      --border-light: #1f1f23;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
      --shadow-glow: 0 0 40px rgba(249, 115, 22, 0.25);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      min-width: 260px;
      height: 100%;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 10;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), min-width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar.collapsed {
      width: 0;
      min-width: 0;
    }

    .sidebar-header {
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .logo svg {
      width: 100%;
      height: 100%;
    }

    .brand-name {
      font-weight: 600;
      font-size: 18px;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .sidebar-section {
      margin-bottom: 16px;
    }

    .sidebar-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-tertiary);
      padding: 8px 12px 6px;
    }

    .new-chat-btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      background: var(--accent);
      border: none;
      color: white;
      font-size: 14px;
      font-weight: 500;
      font-family: var(--font-sans);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all var(--transition);
      margin-bottom: 16px;
    }

    .new-chat-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .new-chat-btn svg {
      width: 18px;
      height: 18px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
    }

    .chat-item:hover {
      background: var(--bg-hover);
    }

    .chat-item.active {
      background: var(--accent-light);
    }

    .chat-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 60%;
      background: var(--accent);
      border-radius: 0 2px 2px 0;
    }

    .chat-item-icon {
      color: var(--text-tertiary);
      flex-shrink: 0;
    }

    .chat-item:hover .chat-item-icon {
      color: var(--accent);
    }

    .chat-item-icon svg {
      width: 16px;
      height: 16px;
    }

    .chat-item-title {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .chat-item.active .chat-item-title {
      color: var(--text-primary);
      font-weight: 500;
    }

    .chat-item:hover .chat-item-title {
      color: var(--text-primary);
    }

    .chat-item-actions {
      display: none;
      gap: 4px;
    }

    .chat-item:hover .chat-item-actions {
      display: flex;
    }

    .chat-item-btn {
      padding: 4px;
      border-radius: 4px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-tertiary);
      transition: all var(--transition);
    }

    .chat-item-btn:hover {
      background: var(--bg-tertiary);
      color: var(--accent);
    }

    .chat-item-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      min-width: 0;
      background: var(--bg-primary);
    }

    /* Top Bar */
    .top-bar {
      height: 56px;
      min-height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      background: var(--bg-secondary);
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .model-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all var(--transition);
      cursor: pointer;
    }

    .model-badge:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .model-badge-dot {
      width: 6px;
      height: 6px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .top-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
    }

    .top-btn:hover {
      background: var(--bg-hover);
      border-color: var(--accent);
      color: var(--accent);
    }

    .top-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Effort Selector */
    .effort-selector {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }

    .effort-btn {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: transparent;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      cursor: pointer;
      transition: all var(--transition);
      font-family: var(--font-sans);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .effort-btn:hover {
      color: var(--text-primary);
      background: var(--bg-hover);
    }

    .effort-btn.active {
      background: var(--accent);
      color: white;
    }

    .effort-btn.ultracode {
      background: linear-gradient(135deg, var(--accent) 0%, #dc2626 100%);
    }

    .effort-btn.ultracode.active {
      background: linear-gradient(135deg, var(--accent) 0%, #dc2626 100%);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Chat Area */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
    }

    .chat-welcome {
      text-align: center;
      padding: 60px 20px;
      max-width: 520px;
      margin: auto;
    }

    .chat-welcome-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 28px;
    }

    .chat-welcome-logo svg {
      width: 100%;
      height: 100%;
    }

    .chat-welcome h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .chat-welcome p {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .quick-action {
      padding: 10px 18px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
    }

    .quick-action:hover {
      background: var(--bg-hover);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    /* Messages */
    .message {
      display: flex;
      gap: 14px;
      margin-bottom: 24px;
      animation: messageIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 12px;
      flex-shrink: 0;
    }

    .message.assistant .message-avatar {
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid rgba(249, 115, 22, 0.2);
    }

    .message.user .message-avatar {
      background: var(--bg-tertiary);
      color: var(--text-tertiary);
      border: 1px solid var(--border);
    }

    .message-content {
      max-width: 72%;
      min-width: 0;
    }

    .message.user .message-content {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .message-bubble {
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.assistant .message-bubble {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px;
    }

    .message.user .message-bubble {
      background: var(--accent);
      border-radius: 16px 4px 16px 16px;
      color: white;
    }

    .message-bubble code {
      font-family: var(--font-mono);
      font-size: 13px;
      background: rgba(0,0,0,0.2);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .message-bubble pre {
      background: #09090b;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 12px 0;
    }

    .message-bubble pre code {
      background: transparent;
      padding: 0;
      color: #e4e4e7;
      font-size: 13px;
      line-height: 1.6;
    }

    .message-time {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 6px;
      padding: 0 4px;
    }

    /* Loading Animation */
    .loading-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .loading-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-dots {
      display: flex;
      gap: 4px;
    }

    .loading-dots span {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .loading-dots span:nth-child(1) { animation-delay: 0s; }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Input Area */
    .input-area {
      padding: 16px 24px 24px;
      background: var(--bg-primary);
    }

    .input-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      transition: all var(--transition);
      max-width: 800px;
      margin: 0 auto;
    }

    .input-container:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    .attached-images {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .attached-image {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .attached-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .attached-image .remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }

    .attached-image .remove-btn:hover {
      background: var(--accent);
    }

    .attached-image .remove-btn svg {
      width: 10px;
      height: 10px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-container textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 14px;
      font-family: var(--font-sans);
      line-height: 1.5;
      resize: none;
      max-height: 150px;
      min-height: 24px;
    }

    .input-container textarea::placeholder {
      color: var(--text-tertiary);
    }

    .input-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .input-btn {
      padding: 8px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-tertiary);
      border-radius: var(--radius-sm);
      transition: all var(--transition);
    }

    .input-btn:hover {
      background: var(--bg-hover);
      color: var(--accent);
    }

    .input-btn svg {
      width: 20px;
      height: 20px;
    }

    .send-btn {
      padding: 10px;
      background: var(--accent);
      border: none;
      cursor: pointer;
      color: white;
      border-radius: var(--radius-md);
      transition: all var(--transition);
    }

    .send-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      width: 90%;
      max-width: 480px;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      transition: all var(--transition);
    }

    .modal-close:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .modal-close svg {
      width: 16px;
      height: 16px;
    }

    .modal-body {
      padding: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-tertiary);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 14px;
      font-family: var(--font-mono);
      color: var(--text-primary);
      transition: all var(--transition);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    .form-input::placeholder {
      color: var(--text-tertiary);
    }

    .form-hint {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 6px;
    }

    .form-btn {
      width: 100%;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: all var(--transition);
    }

    .form-btn.primary {
      background: var(--accent);
      border: none;
      color: white;
    }

    .form-btn.primary:hover {
      background: var(--accent-hover);
    }

    .form-btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .form-btn.secondary:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--bg-tertiary);
    }

    .modal-footer .form-btn {
      flex: 1;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-tertiary);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 100;
        transform: translateX(-100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .message-content {
        max-width: 85%;
      }

      .effort-selector {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="36" height="36" rx="8" fill="var(--bg-tertiary)"/>
            <path d="M18 6L22 14H30L24 19L26 27L18 22L10 27L12 19L6 14H14L18 6Z" fill="var(--accent)"/>
          </svg>
        </div>
        <span class="brand-name">Claudia</span>
      </div>

      <div class="sidebar-content">
        <button class="new-chat-btn" id="newChatBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New Chat
        </button>

        <div class="sidebar-section">
          <div class="sidebar-section-title">Recent</div>
          <div id="recentChats"></div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <div class="top-bar-left">
          <div class="model-badge" id="modelBadge">
            <span class="model-badge-dot"></span>
            <span id="modelName">claude-opus-4-8</span>
          </div>
        </div>

        <div class="top-bar-right">
          <div class="effort-selector">
            <button class="effort-btn" data-effort="low">Low</button>
            <button class="effort-btn active" data-effort="mid">Mid</button>
            <button class="effort-btn" data-effort="high">High</button>
            <button class="effort-btn" data-effort="max">Max</button>
            <button class="effort-btn ultracode" data-effort="ultracode">Ultra</button>
          </div>

          <button class="top-btn" id="settingsBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            Settings
          </button>
        </div>
      </header>

      <div class="chat-area" id="chatArea">
        <div class="chat-welcome" id="chatWelcome">
          <div class="chat-welcome-logo">
            <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="72" height="72" rx="16" fill="var(--bg-tertiary)"/>
              <path d="M36 12L44 28H60L48 38L52 54L36 44L20 54L24 38L12 28H28L36 12Z" fill="var(--accent)"/>
            </svg>
          </div>
          <h1>Claudia</h1>
          <p>Your AI assistant. Start a conversation to get help with any task.</p>
          <div class="quick-actions">
            <button class="quick-action" data-prompt="Help me write a React component">Build a component</button>
            <button class="quick-action" data-prompt="Design a modern landing page">Design a page</button>
            <button class="quick-action" data-prompt="Explain how this code works">Explain code</button>
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-container">
          <div class="attached-images" id="attachedImages"></div>
          <div class="input-row">
            <textarea
              id="messageInput"
              placeholder="Message Claudia..."
              rows="1"
            ></textarea>
            <div class="input-actions">
              <button class="input-btn" id="attachBtn" title="Attach images">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                </svg>
              </button>
              <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
              <button class="send-btn" id="sendBtn" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Settings</h2>
        <button class="modal-close" id="closeSettings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Base URL</label>
          <input type="text" class="form-input" id="baseUrlInput" placeholder="https://api.example.com/">
          <p class="form-hint">The API endpoint for your AI service</p>
        </div>
        <div class="form-group">
          <label class="form-label">API Key</label>
          <input type="password" class="form-input" id="apiKeyInput" placeholder="sk-...">
          <p class="form-hint">Your API authentication key</p>
        </div>
        <div class="form-group">
          <label class="form-label">Model</label>
          <input type="text" class="form-input" id="modelInput" placeholder="claude-opus-4-8" list="modelOptions">
          <datalist id="modelOptions">
            <option value="claude-opus-4-8"></option>
            <option value="claude-opus-4-7"></option>
          </datalist>
          <p class="form-hint">The model to use for completions</p>
        </div>
      </div>
      <div class="modal-footer">
        <button class="form-btn secondary" id="resetSettings">Reset</button>
        <button class="form-btn primary" id="saveSettings">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    // ==================== CONFIG ====================
    const DEFAULT_CONFIG = {
      baseUrl: 'https://api.tokenlayer.net/',
      apiKey: '',
      model: 'claude-opus-4-8'
    };

    const EFFORT_PROMPTS = {
      low: 'Provide a brief, concise response. Keep it simple and to the point.',
      mid: 'Provide a helpful and detailed response. Balance thoroughness with clarity.',
      high: 'Provide a comprehensive and thorough response. Go deep into details and edge cases.',
      max: 'Provide the most comprehensive response possible. Leave no stone unturned.',
      ultracode: 'You are operating in ultracode mode. Use advanced reasoning, multiple perspectives, and exhaustive analysis. Consider second-order effects and implications. For code: write production-grade, complete implementations. For analysis: explore all angles and potential failure modes.'
    };

    const MAX_IMAGES = 4;

    const DEFAULT_SYSTEM_PROMPT = `You are Claudia, a highly capable AI assistant with expertise in frontend design, development, and general problem-solving.

Your capabilities include:
- High-end frontend design using modern aesthetics
- React, Next.js, Vue, and component development
- Design systems and UI/UX patterns
- Code architecture and best practices
- General programming and technical problem-solving

Always respond helpfully and with expertise.`;

    // ==================== STATE ====================
    let config = { ...DEFAULT_CONFIG };
    let conversations = [];
    let currentConversationId = null;
    let isGenerating = false;
    let attachedImages = [];
    let systemPrompt = DEFAULT_SYSTEM_PROMPT;
    let currentEffort = 'mid';

    // ==================== DOM ====================
    const chatArea = document.getElementById('chatArea');
    const chatWelcome = document.getElementById('chatWelcome');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const sidebar = document.getElementById('sidebar');
    const newChatBtn = document.getElementById('newChatBtn');
    const recentChats = document.getElementById('recentChats');
    const attachBtn = document.getElementById('attachBtn');
    const fileInput = document.getElementById('fileInput');
    const attachedImagesContainer = document.getElementById('attachedImages');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const closeSettingsBtn = document.getElementById('closeSettings');
    const saveSettingsBtn = document.getElementById('saveSettings');
    const resetSettingsBtn = document.getElementById('resetSettings');
    const baseUrlInput = document.getElementById('baseUrlInput');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const modelInput = document.getElementById('modelInput');
    const modelNameEl = document.getElementById('modelName');

    // ==================== INIT ====================
    function init() {
      loadConfig();
      loadConversations();
      setupEventListeners();
      autoResizeTextarea();
      updateSendButton();
    }

    function loadConfig() {
      const saved = localStorage.getItem('claudia_config');
      if (saved) {
        config = { ...DEFAULT_CONFIG, ...JSON.parse(saved) };
      }
      baseUrlInput.value = config.baseUrl;
      apiKeyInput.value = config.apiKey;
      modelInput.value = config.model;
      modelNameEl.textContent = config.model;
    }

    function saveConfig() {
      localStorage.setItem('claudia_config', JSON.stringify(config));
      modelNameEl.textContent = config.model;
    }

    function loadConversations() {
      const saved = localStorage.getItem('claudia_conversations');
      if (saved) {
        conversations = JSON.parse(saved);
        renderChatList();
      }
    }

    function saveConversations() {
      localStorage.setItem('claudia_conversations', JSON.stringify(conversations));
    }

    // ==================== CONVERSATIONS ====================
    function createNewChat() {
      const id = Date.now().toString();
      const conversation = {
        id,
        title: 'New Chat',
        createdAt: new Date().toISOString(),
        messages: []
      };
      conversations.unshift(conversation);
      currentConversationId = id;
      attachedImages = [];
      renderAttachedImages();
      saveConversations();
      renderChatList();
      clearChatArea();
      chatWelcome.style.display = 'block';
    }

    function deleteConversation(id) {
      conversations = conversations.filter(c => c.id !== id);
      if (currentConversationId === id) {
        currentConversationId = null;
        attachedImages = [];
        renderAttachedImages();
        clearChatArea();
        chatWelcome.style.display = 'block';
      }
      saveConversations();
      renderChatList();
    }

    function selectConversation(id) {
      currentConversationId = id;
      attachedImages = [];
      renderAttachedImages();
      const conv = conversations.find(c => c.id === id);
      if (conv) {
        renderChatList();
        renderMessages(conv.messages);
      }
    }

    function clearChatArea() {
      chatArea.innerHTML = '';
      chatArea.appendChild(chatWelcome);
      chatWelcome.style.display = 'none';
    }

    function renderChatList() {
      const recent = conversations.slice(0, 15);
      recentChats.innerHTML = recent.map(c => `
        <div class="chat-item ${c.id === currentConversationId ? 'active' : ''}" data-id="${c.id}">
          <span class="chat-item-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </span>
          <span class="chat-item-title">${escapeHtml(c.title)}</span>
          <div class="chat-item-actions">
            <button class="chat-item-btn delete-btn" data-id="${c.id}" title="Delete">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        </div>
      `).join('');

      attachChatItemListeners();
    }

    function attachChatItemListeners() {
      document.querySelectorAll('.chat-item').forEach(item => {
        item.addEventListener('click', (e) => {
          if (!e.target.closest('.chat-item-actions')) {
            selectConversation(item.dataset.id);
          }
        });
      });

      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteConversation(btn.dataset.id);
        });
      });
    }

    function renderMessages(messages) {
      chatArea.innerHTML = '';

      if (messages.length === 0) {
        chatArea.appendChild(chatWelcome);
        chatWelcome.style.display = 'block';
        return;
      }

      chatWelcome.style.display = 'none';

      messages.forEach(msg => {
        appendMessage(msg.role, msg.content, msg.images, false);
      });

      scrollToBottom();
    }

    function appendMessage(role, content, images = [], animate = true) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;

      const avatar = role === 'assistant' ? 'C' : 'U';
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      let imagesHtml = '';
      if (images && images.length > 0) {
        imagesHtml = `
          <div style="display: grid; grid-template-columns: repeat(${Math.min(images.length, 2)}, 1fr); gap: 8px; margin-bottom: 12px; max-width: 300px;">
            ${images.map(img => `
              <div style="border-radius: 8px; overflow: hidden;">
                <img src="${img}" alt="Attached" style="width: 100%; display: block;">
              </div>
            `).join('')}
          </div>
        `;
      }

      messageDiv.innerHTML = `
        <div class="message-avatar">${avatar}</div>
        <div class="message-content">
          ${imagesHtml}
          <div class="message-bubble">${formatContent(content)}</div>
          <div class="message-time">${time}</div>
        </div>
      `;

      chatArea.appendChild(messageDiv);
      scrollToBottom();
    }

    // ==================== ATTACHED IMAGES ====================
    function renderAttachedImages() {
      attachedImagesContainer.innerHTML = attachedImages.map((img, i) => `
        <div class="attached-image">
          <img src="${img}" alt="Attachment ${i + 1}">
          <button class="remove-btn" data-index="${i}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      `).join('');

      attachedImagesContainer.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const index = parseInt(btn.dataset.index);
          attachedImages.splice(index, 1);
          renderAttachedImages();
          updateSendButton();
        });
      });

      updateSendButton();
    }

    function addImage(file) {
      if (attachedImages.length >= MAX_IMAGES) {
        alert(`Maximum ${MAX_IMAGES} images allowed`);
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        attachedImages.push(e.target.result);
        renderAttachedImages();
      };
      reader.readAsDataURL(file);
    }

    function updateSendButton() {
      sendBtn.disabled = (!messageInput.value.trim() && attachedImages.length === 0) || isGenerating;
    }

    // ==================== FORMATTING ====================
    function formatContent(content) {
      let formatted = escapeHtml(content);

      formatted = formatted.replace(/```(\w*)\n?([\s\S]*?)```/g, (match, lang, code) => {
        return `<pre><code class="language-${lang}">${code.trim()}</code></pre>`;
      });

      formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
      formatted = formatted.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      formatted = formatted.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      formatted = formatted.replace(/\n/g, '<br>');

      return formatted;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function scrollToBottom() {
      chatArea.scrollTo({
        top: chatArea.scrollHeight,
        behavior: 'smooth'
      });
    }

    function showLoadingIndicator() {
      const indicator = document.createElement('div');
      indicator.id = 'loadingIndicator';
      indicator.innerHTML = `
        <div class="loading-container">
          <div class="loading-spinner"></div>
          <div class="loading-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <span style="margin-left: 8px;">Thinking...</span>
        </div>
      `;
      chatArea.appendChild(indicator);
      scrollToBottom();
    }

    function hideLoadingIndicator() {
      const indicator = document.getElementById('loadingIndicator');
      if (indicator) indicator.remove();
    }

    // ==================== SEND MESSAGE ====================
    async function sendMessage(content) {
      if (!content.trim() && attachedImages.length === 0 || isGenerating) return;

      if (!config.apiKey) {
        alert('Please set your API key in Settings');
        settingsModal.classList.add('open');
        return;
      }

      if (!currentConversationId) {
        createNewChat();
      }

      const conv = conversations.find(c => c.id === currentConversationId);
      if (!conv) return;

      if (conv.messages.length === 0 && content.trim()) {
        conv.title = content.slice(0, 40) + (content.length > 40 ? '...' : '');
        saveConversations();
        renderChatList();
      }

      chatWelcome.style.display = 'none';

      const imagesToSend = [...attachedImages];
      const contentToSend = content;

      conv.messages.push({ role: 'user', content: contentToSend, images: imagesToSend });
      saveConversations();
      appendMessage('user', contentToSend, imagesToSend);

      attachedImages = [];
      renderAttachedImages();
      messageInput.value = '';
      autoResizeTextarea();
      updateSendButton();

      isGenerating = true;
      showLoadingIndicator();
      updateSendButton();

      try {
        const messages = buildMessages(conv.messages);

        const response = await fetch(config.baseUrl + 'v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${config.apiKey}`
          },
          body: JSON.stringify({
            model: config.model,
            messages: messages,
            stream: false
          })
        });

        hideLoadingIndicator();

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error?.message || `API error: ${response.status}`);
        }

        const data = await response.json();
        const assistantContent = data.choices[0]?.message?.content || 'No response received.';

        conv.messages.push({ role: 'assistant', content: assistantContent });
        saveConversations();
        appendMessage('assistant', assistantContent);

      } catch (error) {
        hideLoadingIndicator();
        appendMessage('assistant', `Error: ${error.message}`);
        console.error('API Error:', error);
      }

      isGenerating = false;
      updateSendButton();
    }

    function buildMessages(messages) {
      const effortInstruction = EFFORT_PROMPTS[currentEffort];

      const formattedMessages = messages.map(m => {
        if (m.images && m.images.length > 0) {
          return {
            role: m.role,
            content: [
              {
                type: "text",
                text: m.content || "What is in these images?"
              },
              ...m.images.map(img => ({
                type: "image_url",
                image_url: { url: img }
              }))
            ]
          };
        }
        return { role: m.role, content: m.content };
      });

      return [
        { role: 'system', content: systemPrompt + '\n\n' + effortInstruction },
        ...formattedMessages
      ];
    }

    // ==================== EVENT LISTENERS ====================
    function setupEventListeners() {
      sendBtn.addEventListener('click', () => sendMessage(messageInput.value));

      messageInput.addEventListener('input', () => {
        autoResizeTextarea();
        updateSendButton();
      });

      messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage(messageInput.value);
        }
      });

      newChatBtn.addEventListener('click', createNewChat);

      attachBtn.addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', (e) => {
        Array.from(e.target.files).forEach(file => {
          if (file.type.startsWith('image/')) {
            addImage(file);
          }
        });
        fileInput.value = '';
      });

      // Settings modal
      settingsBtn.addEventListener('click', () => {
        baseUrlInput.value = config.baseUrl;
        apiKeyInput.value = config.apiKey;
        modelInput.value = config.model;
        settingsModal.classList.add('open');
      });

      closeSettingsBtn.addEventListener('click', () => {
        settingsModal.classList.remove('open');
      });

      settingsModal.addEventListener('click', (e) => {
        if (e.target === settingsModal) {
          settingsModal.classList.remove('open');
        }
      });

      saveSettingsBtn.addEventListener('click', () => {
        config.baseUrl = baseUrlInput.value.trim() || DEFAULT_CONFIG.baseUrl;
        config.apiKey = apiKeyInput.value.trim();
        config.model = modelInput.value.trim() || DEFAULT_CONFIG.model;
        saveConfig();
        settingsModal.classList.remove('open');
      });

      resetSettingsBtn.addEventListener('click', () => {
        config = { ...DEFAULT_CONFIG };
        baseUrlInput.value = config.baseUrl;
        apiKeyInput.value = config.apiKey;
        modelInput.value = config.model;
        saveConfig();
      });

      // Effort selector
      document.querySelectorAll('.effort-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.effort-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentEffort = btn.dataset.effort;
        });
      });

      // Quick actions
      document.querySelectorAll('.quick-action').forEach(btn => {
        btn.addEventListener('click', () => {
          messageInput.value = btn.dataset.prompt;
          updateSendButton();
          autoResizeTextarea();
          messageInput.focus();
        });
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          settingsModal.classList.remove('open');
        }
      });
    }

    function autoResizeTextarea() {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + 'px';
    }

    // Start
    init();
  </script>
</body>
