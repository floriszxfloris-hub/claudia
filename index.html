<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claudia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0a0a0b;
      --bg-secondary: #111113;
      --bg-tertiary: #18181b;
      --bg-elevated: #1f1f23;
      --bg-hover: #27272a;
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-tertiary: #71717a;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --accent-light: rgba(249, 115, 22, 0.1);
      --accent-glow: rgba(249, 115, 22, 0.4);
      --border: #27272a;
      --border-light: #1f1f23;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
      --shadow-glow: 0 0 40px rgba(249, 115, 22, 0.25);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --font-sans: 'Newsreader', Georgia, 'Times New Roman', serif;
      --font-serif: 'Fraunces', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Animated gradient background */
    .gradient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .gradient-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      will-change: transform;
    }

    .gradient-blob.b1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #f97316, transparent 70%);
      top: -150px;
      left: -100px;
      animation: drift1 20s ease-in-out infinite;
    }

    .gradient-blob.b2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #dc2626, transparent 70%);
      bottom: -100px;
      right: -50px;
      animation: drift2 25s ease-in-out infinite;
    }

    .gradient-blob.b3 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, #ea580c, transparent 70%);
      top: 40%;
      left: 50%;
      animation: drift3 30s ease-in-out infinite;
    }

    @keyframes drift1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(100px, 80px) scale(1.1); }
      66% { transform: translate(50px, 150px) scale(0.95); }
    }

    @keyframes drift2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(-120px, -60px) scale(1.15); }
      66% { transform: translate(-60px, -120px) scale(0.9); }
    }

    @keyframes drift3 {
      0%, 100% { transform: translate(-50%, 0) scale(1); }
      50% { transform: translate(-60%, -80px) scale(1.2); }
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100vw;
      position: relative;
      z-index: 1;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      min-width: 260px;
      height: 100%;
      background: rgba(17, 17, 19, 0.8);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 10;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), min-width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar.collapsed {
      width: 0;
      min-width: 0;
    }

    .sidebar-header {
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .logo svg {
      width: 100%;
      height: 100%;
    }

    .brand-name {
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 19px;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .sidebar-section {
      margin-bottom: 16px;
    }

    .sidebar-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-tertiary);
      padding: 8px 12px 6px;
    }

    .new-chat-btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      background: var(--accent);
      border: none;
      color: white;
      font-size: 14px;
      font-weight: 500;
      font-family: var(--font-sans);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all var(--transition);
      margin-bottom: 16px;
    }

    .new-chat-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-glow);
    }

    .new-chat-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .new-chat-btn svg {
      width: 18px;
      height: 18px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      animation: slideInLeft 0.4s cubic-bezier(0.4, 0, 0.2, 1) backwards;
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-16px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .chat-item:hover {
      background: var(--bg-hover);
      transform: translateX(2px);
    }

    .chat-item.active {
      background: var(--accent-light);
    }

    .chat-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 60%;
      background: var(--accent);
      border-radius: 0 2px 2px 0;
    }

    .chat-item-icon {
      color: var(--text-tertiary);
      flex-shrink: 0;
    }

    .chat-item:hover .chat-item-icon {
      color: var(--accent);
    }

    .chat-item-icon svg {
      width: 16px;
      height: 16px;
    }

    .chat-item-title {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .chat-item.active .chat-item-title {
      color: var(--text-primary);
      font-weight: 500;
    }

    .chat-item:hover .chat-item-title {
      color: var(--text-primary);
    }

    .chat-item-actions {
      display: none;
      gap: 4px;
    }

    .chat-item:hover .chat-item-actions {
      display: flex;
    }

    .chat-item-btn {
      padding: 4px;
      border-radius: 4px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-tertiary);
      transition: all var(--transition);
    }

    .chat-item-btn:hover {
      background: var(--bg-tertiary);
      color: var(--accent);
    }

    .chat-item-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      min-width: 0;
    }

    /* Top Bar */
    .top-bar {
      height: 56px;
      min-height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      background: rgba(17, 17, 19, 0.6);
      backdrop-filter: blur(20px);
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .model-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all var(--transition);
      cursor: pointer;
    }

    .model-badge:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .model-badge-dot {
      width: 6px;
      height: 6px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      50% { opacity: 0.6; box-shadow: 0 0 0 4px rgba(34, 197, 94, 0); }
    }

    .top-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
    }

    .top-btn:hover {
      background: var(--bg-hover);
      border-color: var(--accent);
      color: var(--accent);
    }

    .top-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Effort Selector */
    .effort-selector {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }

    .effort-btn {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: transparent;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      cursor: pointer;
      transition: all var(--transition);
      font-family: var(--font-sans);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .effort-btn:hover {
      color: var(--text-primary);
      background: var(--bg-hover);
    }

    .effort-btn.active {
      background: var(--accent);
      color: white;
    }

    .effort-btn.ultracode {
      background: linear-gradient(135deg, var(--accent) 0%, #dc2626 100%);
      color: rgba(255,255,255,0.7);
    }

    .effort-btn.ultracode.active {
      background: linear-gradient(135deg, var(--accent) 0%, #dc2626 100%);
      color: white;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Chat Area */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
    }

    .chat-welcome {
      text-align: center;
      padding: 60px 20px;
      max-width: 520px;
      margin: auto;
      animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-welcome-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 28px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .chat-welcome-logo svg {
      width: 100%;
      height: 100%;
    }

    .chat-welcome h1 {
      font-family: var(--font-serif);
      font-size: 34px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .chat-welcome p {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .quick-action {
      padding: 10px 18px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
    }

    .quick-action:hover {
      background: var(--bg-hover);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    /* Messages */
    .message {
      display: flex;
      gap: 14px;
      margin-bottom: 24px;
      animation: messageIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 12px;
      flex-shrink: 0;
    }

    .message.assistant .message-avatar {
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid rgba(249, 115, 22, 0.2);
    }

    .message.user .message-avatar {
      background: var(--bg-tertiary);
      color: var(--text-tertiary);
      border: 1px solid var(--border);
    }

    .message-content {
      max-width: 72%;
      min-width: 0;
    }

    .message.user .message-content {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .message-bubble {
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.7;
      word-wrap: break-word;
      position: relative;
    }

    .message.assistant .message-bubble {
      background: rgba(24, 24, 27, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px;
    }

    .message.user .message-bubble {
      background: var(--accent);
      border-radius: 16px 4px 16px 16px;
      color: white;
      white-space: pre-wrap;
    }

    .message-bubble code {
      font-family: var(--font-mono);
      font-size: 13px;
      background: rgba(0,0,0,0.3);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .message-bubble pre {
      background: #09090b;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 12px 0;
      position: relative;
    }

    .message-bubble pre code {
      background: transparent;
      padding: 0;
      color: #e4e4e7;
      font-size: 13px;
      line-height: 1.6;
    }

    /* Copy button on code blocks */
    .code-copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 5px 8px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-tertiary);
      font-size: 11px;
      font-family: var(--font-sans);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0;
      transition: all var(--transition);
    }

    .message-bubble pre:hover .code-copy-btn {
      opacity: 1;
    }

    .code-copy-btn:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .code-copy-btn svg {
      width: 12px;
      height: 12px;
    }

    /* Message action bar */
    .message-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      padding: 0 4px;
      opacity: 0;
      transition: opacity var(--transition);
    }

    .message:hover .message-actions {
      opacity: 1;
    }

    .msg-action-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: var(--text-tertiary);
      font-size: 11px;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: all var(--transition);
    }

    .msg-action-btn:hover {
      background: var(--bg-hover);
      color: var(--accent);
    }

    .msg-action-btn svg {
      width: 13px;
      height: 13px;
    }

    .message-time {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 6px;
      padding: 0 4px;
    }

    /* Streaming cursor */
    .stream-cursor {
      display: inline-block;
      width: 7px;
      height: 15px;
      background: var(--accent);
      margin-left: 2px;
      border-radius: 1px;
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Skeleton shimmer loading */
    .skeleton-bubble {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px 18px;
      background: rgba(24, 24, 27, 0.7);
      border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px;
      min-width: 240px;
    }

    .skeleton-line {
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(
        90deg,
        var(--bg-hover) 0%,
        var(--bg-elevated) 20%,
        var(--accent-light) 40%,
        var(--bg-elevated) 60%,
        var(--bg-hover) 100%
      );
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    .skeleton-line.w1 { width: 90%; }
    .skeleton-line.w2 { width: 100%; }
    .skeleton-line.w3 { width: 65%; }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Input Area */
    .input-area {
      padding: 16px 24px 24px;
    }

    .input-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(17, 17, 19, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      transition: all var(--transition);
      max-width: 800px;
      margin: 0 auto;
    }

    .input-container:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light), 0 0 24px rgba(249, 115, 22, 0.15);
    }

    .attached-images {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .attached-image {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.7); }
      to { opacity: 1; transform: scale(1); }
    }

    .attached-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .attached-image .remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }

    .attached-image .remove-btn:hover {
      background: var(--accent);
    }

    .attached-image .remove-btn svg {
      width: 10px;
      height: 10px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-container textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 14px;
      font-family: var(--font-sans);
      line-height: 1.5;
      resize: none;
      max-height: 150px;
      min-height: 24px;
    }

    .input-container textarea::placeholder {
      color: var(--text-tertiary);
    }

    .input-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .input-btn {
      padding: 8px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-tertiary);
      border-radius: var(--radius-sm);
      transition: all var(--transition);
    }

    .input-btn:hover {
      background: var(--bg-hover);
      color: var(--accent);
    }

    .input-btn svg {
      width: 20px;
      height: 20px;
    }

    .send-btn {
      padding: 10px;
      background: var(--accent);
      border: none;
      cursor: pointer;
      color: white;
      border-radius: var(--radius-md);
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .send-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    .send-btn:active {
      transform: scale(0.92);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
    }

    /* Stop button state */
    .send-btn.stop {
      background: #dc2626;
      animation: stopPulse 1.5s infinite;
    }

    .send-btn.stop:hover {
      background: #b91c1c;
    }

    @keyframes stopPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
      50% { box-shadow: 0 0 0 6px rgba(220, 38, 38, 0); }
    }

    .stop-icon {
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 3px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      width: 90%;
      max-width: 480px;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      transition: all var(--transition);
    }

    .modal-close:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      transform: rotate(90deg);
    }

    .modal-close svg {
      width: 16px;
      height: 16px;
    }

    .modal-body {
      padding: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-tertiary);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 14px;
      font-family: var(--font-mono);
      color: var(--text-primary);
      transition: all var(--transition);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    .form-input::placeholder {
      color: var(--text-tertiary);
    }

    .form-hint {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 6px;
    }

    .form-btn {
      width: 100%;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: all var(--transition);
    }

    .form-btn.primary {
      background: var(--accent);
      border: none;
      color: white;
    }

    .form-btn.primary:hover {
      background: var(--accent-hover);
    }

    .form-btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .form-btn.secondary:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--bg-tertiary);
    }

    .modal-footer .form-btn {
      flex: 1;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 20px;
      font-size: 13px;
      color: var(--text-primary);
      box-shadow: var(--shadow-lg);
      z-index: 2000;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast svg {
      width: 16px;
      height: 16px;
      color: var(--accent);
    }

    /* Model Dropdown */
    .model-dropdown {
      position: relative;
    }

    .model-badge svg {
      width: 12px;
      height: 12px;
      transition: transform var(--transition);
    }

    .model-dropdown.open .model-badge svg {
      transform: rotate(180deg);
    }

    .model-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 6px;
      min-width: 200px;
      z-index: 500;
      box-shadow: var(--shadow-lg);
      display: none;
      animation: modalIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .model-dropdown.open .model-menu {
      display: block;
    }

    .model-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition);
      font-size: 13px;
      color: var(--text-secondary);
    }

    .model-option:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .model-option.active {
      background: var(--accent-light);
      color: var(--accent);
    }

    .model-option .check {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      opacity: 0;
    }

    .model-option.active .check {
      opacity: 1;
    }

    .model-option .check svg {
      width: 16px;
      height: 16px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-tertiary);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 100;
        transform: translateX(-100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .message-content {
        max-width: 85%;
      }

      .effort-selector {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="gradient-bg">
    <div class="gradient-blob b1"></div>
    <div class="gradient-blob b2"></div>
    <div class="gradient-blob b3"></div>
  </div>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">

          <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">

    <main class="main-content">
      <header class="top-bar">

              <span class="model-badge-dot"></span>
              <span id="modelName">claude-opus-4-8</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>

          <button class="top-btn" id="settingsBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            Settings
          </button>
        </div>
      </header>

      <div class="chat-area" id="chatArea">
        <div class="chat-welcome" id="chatWelcome">
          <div class="chat-welcome-logo">
            <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="72" height="72" rx="16" fill="var(--bg-tertiary)"/>
              <path d="M36 12L44 28H60L48 38L52 54L36 44L20 54L24 38L12 28H28L36 12Z" fill="var(--accent)"/>
            </svg>
          </div>
          <h1>Claudia</h1>
          <p>Your AI assistant. Start a conversation to get help with any task.</p>
          <div class="quick-actions">
            <button class="quick-action" data-prompt="Help me write a React component">Build a component</button>
            <button class="quick-action" data-prompt="Design a modern landing page">Design a page</button>

      <div class="input-area">

              <button class="input-btn" id="attachBtn" title="Attach images">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Settings</h2>
        <button class="modal-close" id="closeSettings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Base URL</label>
          <input type="text" class="form-input" id="baseUrlInput" placeholder="https://api.example.com/">
          <p class="form-hint">The API endpoint for your AI service</p>
        </div>
        <div class="form-group">
          <label class="form-label">API Key</label>
          <input type="password" class="form-input" id="apiKeyInput" placeholder="sk-...">
          <p class="form-hint">Your API authentication key</p>
        </div>
        <div class="form-group">
          <label class="form-label">Model</label>
          <input type="text" class="form-input" id="modelInput" placeholder="claude-opus-4-8" list="modelOptions">
          <datalist id="modelOptions">
            <option value="claude-opus-4-8"></option>
            <option value="claude-opus-4-7"></option>
          </datalist>
          <p class="form-hint">The model to use for completions</p>
        </div>
      </div>
      <div class="modal-footer">
        <button class="form-btn secondary" id="resetSettings">Reset</button>
        <button class="form-btn primary" id="saveSettings">Save Changes</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span id="toastText">Copied!</span>
  </div>

  <script>
    // ==================== CONFIG ====================
    const DEFAULT_CONFIG = {
      baseUrl: 'https://api.tokenlayer.net/',
      apiKey: '',
      model: 'claude-opus-4-8'
    };

    const EFFORT_PROMPTS = {
      low: 'Provide a brief, concise response. Keep it simple and to the point.',
      mid: 'Provide a helpful and detailed response. Balance thoroughness with clarity.',
      high: 'Provide a comprehensive and thorough response. Go deep into details and edge cases.',
      max: 'Provide the most comprehensive response possible. Leave no stone unturned.',
      ultracode: 'You are operating in ultracode mode. Use advanced reasoning, multiple perspectives, and exhaustive analysis. Consider second-order effects and implications. For code: write production-grade, complete implementations. For analysis: explore all angles and potential failure modes.'
    };

    const MAX_IMAGES = 4;

    const DEFAULT_SYSTEM_PROMPT = `You are Claudia, a highly capable AI assistant with expertise in frontend design, development, and general problem-solving.

Your capabilities include:
- High-end frontend design using modern aesthetics
- React, Next.js, Vue, and component development
- Design systems and UI/UX patterns
- Code architecture and best practices
- General programming and technical problem-solving

Always respond helpfully and with expertise.`;

    // ==================== STATE ====================
    let config = { ...DEFAULT_CONFIG };
    let conversations = [];
    let currentConversationId = null;
    let isGenerating = false;
    let attachedImages = [];
    let systemPrompt = DEFAULT_SYSTEM_PROMPT;
    let currentEffort = 'mid';
    let abortController = null;

    // ==================== DOM ====================
    const chatArea = document.getElementById('chatArea');
    const chatWelcome = document.getElementById('chatWelcome');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const sidebar = document.getElementById('sidebar');
    const newChatBtn = document.getElementById('newChatBtn');
    const recentChats = document.getElementById('recentChats');
    const attachBtn = document.getElementById('attachBtn');
    const fileInput = document.getElementById('fileInput');
    const attachedImagesContainer = document.getElementById('attachedImages');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const closeSettingsBtn = document.getElementById('closeSettings');
    const saveSettingsBtn = document.getElementById('saveSettings');
    const resetSettingsBtn = document.getElementById('resetSettings');
    const baseUrlInput = document.getElementById('baseUrlInput');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const modelInput = document.getElementById('modelInput');
    const modelNameEl = document.getElementById('modelName');
    const modelDropdown = document.getElementById('modelDropdown');
    const modelBadge = document.getElementById('modelBadge');
    const modelMenu = document.getElementById('modelMenu');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');

    // ==================== INIT ====================
    function init() {
      loadConfig();
      loadConversations();
      setupEventListeners();
      autoResizeTextarea();
      updateSendButton();
    }

    function loadConfig() {
      const saved = localStorage.getItem('claudia_config');
      if (saved) {
        config = { ...DEFAULT_CONFIG, ...JSON.parse(saved) };
      }
      baseUrlInput.value = config.baseUrl;
      apiKeyInput.value = config.apiKey;
      modelInput.value = config.model;
      modelNameEl.textContent = config.model;
      syncModelMenu();
    }

    function saveConfig() {
      localStorage.setItem('claudia_config', JSON.stringify(config));
      modelNameEl.textContent = config.model;
      syncModelMenu();
    }

    function syncModelMenu() {
      document.querySelectorAll('.model-option').forEach(opt => {
        opt.classList.toggle('active', opt.dataset.model === config.model);
      });
    }

    function loadConversations() {
      const saved = localStorage.getItem('claudia_conversations');
      if (saved) {
        conversations = JSON.parse(saved);
        renderChatList();
      }
    }

    function saveConversations() {
      localStorage.setItem('claudia_conversations', JSON.stringify(conversations));
    }

    // ==================== CONVERSATIONS ====================
    function createNewChat() {
      const id = Date.now().toString();
      const conversation = {
        id,
        title: 'New Chat',
        createdAt: new Date().toISOString(),
        messages: []
      };
      conversations.unshift(conversation);
      currentConversationId = id;
      attachedImages = [];
      renderAttachedImages();
      saveConversations();
      renderChatList();
      clearChatArea();
      chatWelcome.style.display = 'block';
    }

    function deleteConversation(id) {
      conversations = conversations.filter(c => c.id !== id);
      if (currentConversationId === id) {
        currentConversationId = null;
        attachedImages = [];
        renderAttachedImages();
        clearChatArea();
        chatWelcome.style.display = 'block';
      }
      saveConversations();
      renderChatList();
    }

    function selectConversation(id) {
      currentConversationId = id;
      attachedImages = [];
      renderAttachedImages();
      const conv = conversations.find(c => c.id === id);
      if (conv) {
        renderChatList();
        renderMessages(conv.messages);
      }
    }

    function clearChatArea() {
      chatArea.innerHTML = '';
      chatArea.appendChild(chatWelcome);
      chatWelcome.style.display = 'none';
    }

    function renderChatList() {
      const recent = conversations.slice(0, 15);
      recentChats.innerHTML = recent.map((c, i) => `
        <div class="chat-item ${c.id === currentConversationId ? 'active' : ''}" data-id="${c.id}" style="animation-delay: ${i * 0.03}s">
          <span class="chat-item-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </span>
          <span class="chat-item-title">${escapeHtml(c.title)}</span>
          <div class="chat-item-actions">
            <button class="chat-item-btn delete-btn" data-id="${c.id}" title="Delete">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        </div>
      `).join('');

      attachChatItemListeners();
    }

    function attachChatItemListeners() {
      document.querySelectorAll('.chat-item').forEach(item => {
        item.addEventListener('click', (e) => {
          if (!e.target.closest('.chat-item-actions')) {
            selectConversation(item.dataset.id);
          }
        });
      });

      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteConversation(btn.dataset.id);
        });
      });
    }

    function renderMessages(messages) {
      chatArea.innerHTML = '';

      if (messages.length === 0) {
        chatArea.appendChild(chatWelcome);
        chatWelcome.style.display = 'block';
        return;
      }

      chatWelcome.style.display = 'none';

      messages.forEach(msg => {
        appendMessage(msg.role, msg.content, msg.images);
      });

      scrollToBottom();
    }

    function appendMessage(role, content, images = []) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;

      const avatar = role === 'assistant' ? 'C' : 'U';
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      let imagesHtml = '';
      if (images && images.length > 0) {
        imagesHtml = `
          <div style="display: grid; grid-template-columns: repeat(${Math.min(images.length, 2)}, 1fr); gap: 8px; margin-bottom: 12px; max-width: 300px;">
            ${images.map(img => `
              <div style="border-radius: 8px; overflow: hidden;">
                <img src="${img}" alt="Attached" style="width: 100%; display: block;">
              </div>
            `).join('')}
          </div>
        `;
      }

      const actionsHtml = role === 'assistant' ? `
        <div class="message-actions">
          <button class="msg-action-btn copy-msg-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            Copy
          </button>
        </div>
      ` : '';

      messageDiv.innerHTML = `
        <div class="message-avatar">${avatar}</div>
        <div class="message-content">
          ${imagesHtml}
          <div class="message-bubble">${formatContent(content)}</div>
          ${actionsHtml}
          <div class="message-time">${time}</div>
        </div>
      `;

      chatArea.appendChild(messageDiv);
      attachCodeCopyButtons(messageDiv);
      attachMessageCopyButton(messageDiv, content);
      scrollToBottom();
      return messageDiv;
    }

    // Copy buttons on code blocks
    function attachCodeCopyButtons(container) {
      container.querySelectorAll('pre').forEach(pre => {
        if (pre.querySelector('.code-copy-btn')) return;
        const btn = document.createElement('button');
        btn.className = 'code-copy-btn';
        btn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Copy
        `;
        btn.addEventListener('click', () => {
          const code = pre.querySelector('code');
          navigator.clipboard.writeText(code ? code.textContent : pre.textContent);
          showToast('Code copied!');
        });
        pre.appendChild(btn);
      });
    }

    function attachMessageCopyButton(container, content) {
      const btn = container.querySelector('.copy-msg-btn');
      if (btn) {
        btn.addEventListener('click', () => {
          navigator.clipboard.writeText(content);
          showToast('Message copied!');
        });
      }
    }

    // ==================== ATTACHED IMAGES ====================
    function renderAttachedImages() {
      attachedImagesContainer.innerHTML = attachedImages.map((img, i) => `
        <div class="attached-image">
          <img src="${img}" alt="Attachment ${i + 1}">
          <button class="remove-btn" data-index="${i}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      `).join('');

      attachedImagesContainer.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const index = parseInt(btn.dataset.index);
          attachedImages.splice(index, 1);
          renderAttachedImages();
          updateSendButton();
        });
      });

      updateSendButton();
    }

    function addImage(file) {
      if (attachedImages.length >= MAX_IMAGES) {
        showToast(`Maximum ${MAX_IMAGES} images allowed`);
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        attachedImages.push(e.target.result);
        renderAttachedImages();
      };
      reader.readAsDataURL(file);
    }

    function updateSendButton() {
      if (isGenerating) {
        sendBtn.disabled = false;
        return;
      }
      sendBtn.disabled = !messageInput.value.trim() && attachedImages.length === 0;
    }

    // ==================== FORMATTING ====================
    function formatContent(content) {
      let formatted = escapeHtml(content);

      formatted = formatted.replace(/```(\w*)\n?([\s\S]*?)```/g, (match, lang, code) => {
        return `<pre><code class="language-${lang}">${code.trim()}</code></pre>`;
      });

      formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
      formatted = formatted.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      formatted = formatted.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      formatted = formatted.replace(/\n/g, '<br>');

      return formatted;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function scrollToBottom() {
      chatArea.scrollTo({
        top: chatArea.scrollHeight,
        behavior: 'smooth'
      });
    }

    function showToast(msg) {
      toastText.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // Skeleton shimmer loader
    function showSkeleton() {
      const skeleton = document.createElement('div');
      skeleton.className = 'message assistant';
      skeleton.id = 'skeletonLoader';
      skeleton.innerHTML = `
        <div class="message-avatar">C</div>
        <div class="message-content">
          <div class="skeleton-bubble">
            <div class="skeleton-line w1"></div>
            <div class="skeleton-line w2"></div>
            <div class="skeleton-line w3"></div>
          </div>
        </div>
      `;
      chatArea.appendChild(skeleton);
      scrollToBottom();
    }

    function hideSkeleton() {
      const skeleton = document.getElementById('skeletonLoader');
      if (skeleton) skeleton.remove();
    }

    // ==================== SEND / STREAM MESSAGE ====================
    async function sendMessage(content) {
      if (!content.trim() && attachedImages.length === 0 || isGenerating) return;

      if (!config.apiKey) {
        showToast('Set your API key in Settings first');
        settingsModal.classList.add('open');
        return;
      }

      if (!currentConversationId) {
        createNewChat();
      }

      const conv = conversations.find(c => c.id === currentConversationId);
      if (!conv) return;

      if (conv.messages.length === 0 && content.trim()) {
        conv.title = content.slice(0, 40) + (content.length > 40 ? '...' : '');
        saveConversations();
        renderChatList();
      }

      chatWelcome.style.display = 'none';

      const imagesToSend = [...attachedImages];
      const contentToSend = content;

      conv.messages.push({ role: 'user', content: contentToSend, images: imagesToSend });
      saveConversations();
      appendMessage('user', contentToSend, imagesToSend);

      attachedImages = [];
      renderAttachedImages();
      messageInput.value = '';
      autoResizeTextarea();

      isGenerating = true;
      setStopButton(true);
      showSkeleton();

      abortController = new AbortController();

      let assistantContent = '';
      let assistantBubble = null;
      let assistantDiv = null;

      try {
        const messages = buildMessages(conv.messages);

        const response = await fetch(config.baseUrl + 'v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${config.apiKey}`
          },
          body: JSON.stringify({
            model: config.model,
            messages: messages,
            stream: true
          }),
          signal: abortController.signal
        });

        if (!response.ok) {
          hideSkeleton();
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error?.message || `API error: ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let firstToken = true;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || !trimmed.startsWith('data:')) continue;
            const data = trimmed.slice(5).trim();
            if (data === '[DONE]') continue;

            try {
              const parsed = JSON.parse(data);
              const delta = parsed.choices?.[0]?.delta?.content || '';
              if (delta) {
                assistantContent += delta;

                if (firstToken) {
                  firstToken = false;
                  hideSkeleton();
                  assistantDiv = createStreamingMessage();
                  assistantBubble = assistantDiv.querySelector('.message-bubble');
                }

                assistantBubble.innerHTML = formatContent(assistantContent) + '<span class="stream-cursor"></span>';
                attachCodeCopyButtons(assistantDiv);
                scrollToBottom();
              }
            } catch (e) {
              // skip malformed chunks
            }
          }
        }

        // Fallback if nothing streamed (non-streaming response)
        if (firstToken) {
          hideSkeleton();
          assistantDiv = createStreamingMessage();
          assistantBubble = assistantDiv.querySelector('.message-bubble');
        }

        // Finalize — remove cursor, add actions
        if (assistantBubble) {
          assistantBubble.innerHTML = formatContent(assistantContent);
          attachCodeCopyButtons(assistantDiv);
          finalizeAssistantMessage(assistantDiv, assistantContent);
        }

        conv.messages.push({ role: 'assistant', content: assistantContent });
        saveConversations();

      } catch (error) {
        hideSkeleton();
        if (error.name === 'AbortError') {
          if (assistantContent) {
            if (assistantBubble) {
              assistantBubble.innerHTML = formatContent(assistantContent);
              attachCodeCopyButtons(assistantDiv);
              finalizeAssistantMessage(assistantDiv, assistantContent);
            }
            conv.messages.push({ role: 'assistant', content: assistantContent });
            saveConversations();
          }
        } else {
          appendMessage('assistant', `Error: ${error.message}`);
          console.error('API Error:', error);
        }
      }

      isGenerating = false;
      abortController = null;
      setStopButton(false);
      updateSendButton();
    }

    function createStreamingMessage() {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message assistant';
      messageDiv.innerHTML = `
        <div class="message-avatar">C</div>
        <div class="message-content">
          <div class="message-bubble"></div>
        </div>
      `;
      chatArea.appendChild(messageDiv);
      scrollToBottom();
      return messageDiv;
    }

    function finalizeAssistantMessage(messageDiv, content) {
      const contentEl = messageDiv.querySelector('.message-content');
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const actions = document.createElement('div');
      actions.className = 'message-actions';
      actions.innerHTML = `
        <button class="msg-action-btn copy-msg-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Copy
        </button>
      `;
      contentEl.appendChild(actions);

      const timeEl = document.createElement('div');
      timeEl.className = 'message-time';
      timeEl.textContent = time;
      contentEl.appendChild(timeEl);

      const copyBtn = actions.querySelector('.copy-msg-btn');
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(content);
        showToast('Message copied!');
      });
    }

    function setStopButton(isStop) {
      if (isStop) {
        sendBtn.classList.add('stop');
        sendBtn.innerHTML = '<div class="stop-icon"></div>';
        sendBtn.disabled = false;
      } else {
        sendBtn.classList.remove('stop');
        sendBtn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        `;
      }
    }

    function buildMessages(messages) {
      const effortInstruction = EFFORT_PROMPTS[currentEffort];

      const formattedMessages = messages.map(m => {
        if (m.images && m.images.length > 0) {
          return {
            role: m.role,
            content: [
              {
                type: "text",
                text: m.content || "What is in these images?"
              },
              ...m.images.map(img => ({
                type: "image_url",
                image_url: { url: img }
              }))
            ]
          };
        }
        return { role: m.role, content: m.content };
      });

      return [
        { role: 'system', content: systemPrompt + '\n\n' + effortInstruction },
        ...formattedMessages
      ];
    }

    // ==================== EVENT LISTENERS ====================
    function setupEventListeners() {
      sendBtn.addEventListener('click', () => {
        if (isGenerating) {
          if (abortController) abortController.abort();
        } else {
          sendMessage(messageInput.value);
        }
      });

      messageInput.addEventListener('input', () => {
        autoResizeTextarea();
        updateSendButton();
      });

      messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (!isGenerating) sendMessage(messageInput.value);
        }
      });

      newChatBtn.addEventListener('click', createNewChat);

      // Model dropdown
      modelBadge.addEventListener('click', (e) => {
        e.stopPropagation();
        modelDropdown.classList.toggle('open');
      });

      document.querySelectorAll('.model-option').forEach(opt => {
        opt.addEventListener('click', () => {
          config.model = opt.dataset.model;
          modelInput.value = config.model;
          saveConfig();
          modelDropdown.classList.remove('open');
          showToast(`Switched to ${config.model}`);
        });
      });

      document.addEventListener('click', () => {
        modelDropdown.classList.remove('open');
      });

      modelMenu.addEventListener('click', (e) => e.stopPropagation());

      attachBtn.addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', (e) => {
        Array.from(e.target.files).forEach(file => {
          if (file.type.startsWith('image/')) {
            addImage(file);
          }
        });
        fileInput.value = '';
      });

      // Settings modal
      settingsBtn.addEventListener('click', () => {
        baseUrlInput.value = config.baseUrl;
        apiKeyInput.value = config.apiKey;
        modelInput.value = config.model;
        settingsModal.classList.add('open');
      });

      closeSettingsBtn.addEventListener('click', () => {
        settingsModal.classList.remove('open');
      });

      settingsModal.addEventListener('click', (e) => {
        if (e.target === settingsModal) {
          settingsModal.classList.remove('open');
        }
      });

      saveSettingsBtn.addEventListener('click', () => {
        config.baseUrl = baseUrlInput.value.trim() || DEFAULT_CONFIG.baseUrl;
        config.apiKey = apiKeyInput.value.trim();
        config.model = modelInput.value.trim() || DEFAULT_CONFIG.model;
        saveConfig();
        settingsModal.classList.remove('open');
        showToast('Settings saved');
      });

      resetSettingsBtn.addEventListener('click', () => {
        config = { ...DEFAULT_CONFIG };
        baseUrlInput.value = config.baseUrl;
        apiKeyInput.value = config.apiKey;
        modelInput.value = config.model;
        saveConfig();
      });

      // Effort selector
      document.querySelectorAll('.effort-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.effort-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentEffort = btn.dataset.effort;
        });
      });

      // Quick actions
      document.querySelectorAll('.quick-action').forEach(btn => {
        btn.addEventListener('click', () => {
          messageInput.value = btn.dataset.prompt;
          updateSendButton();
          autoResizeTextarea();
          messageInput.focus();
        });
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          settingsModal.classList.remove('open');
        }
      });
    }

    function autoResizeTextarea() {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + 'px';
    }

    // Start
    init();
  </script>
</body>
</html>
